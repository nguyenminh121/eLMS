<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- Open book icon — bottom spine -->
  <path d="M12 44 Q32 40 52 44" stroke="#a5b4fc" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Left page -->
  <path d="M12 44 L14 22 Q23 18 32 22 L32 44 Z" fill="#c7d2fe" opacity="0.9"/>
  <!-- Left page inner line -->
  <line x1="18" y1="28" x2="28" y2="26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="33" x2="28" y2="31" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="38" x2="28" y2="37" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Right page -->
  <path d="M52 44 L50 22 Q41 18 32 22 L32 44 Z" fill="#e0e7ff" opacity="0.95"/>
  <!-- Right page inner line -->
  <line x1="46" y1="28" x2="36" y2="26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="33" x2="36" y2="31" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="38" x2="36" y2="37" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Spine center fold -->
  <line x1="32" y1="22" x2="32" y2="44" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>

  <!-- Graduation cap / mortarboard on top -->
  <!-- Cap brim (flat square) -->
  <rect x="20" y="13" width="24" height="5" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <!-- Cap top (diamond shape) -->
  <polygon points="32,7 44,13 32,13 20,13" fill="#e0e7ff" opacity="0.95"/>
  <!-- Cap tassel -->
  <circle cx="44" cy="13" r="1.5" fill="#fbbf24"/>
  <line x1="44" y1="14.5" x2="44" y2="20" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="20" x2="46" y2="20" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>